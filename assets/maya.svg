  <title
     id="mascot-title">Mascote chibi de cabelos brancos</title>
  <desc
     id="mascot-description">Personagem chibi de frente: cabelos brancos longos, uma flor branca amarela no lado esquerdo, olhos castanhos e vestido preto. Vetores separados para animação.</desc>
  <!--
    Pure SVG / no embedded raster or fonts / transparent background.
    Elements have stable IDs. Each animated anatomical part has complete
    geometry extending into the layers that obscure it in this rest pose.
    Layer order is deliberate; keep it when adding animation.
    Canvas/pivot reference: body (548,850), face (547,683), flower (307,369).
  -->
  <style
     id="style1">
    .outline { stroke: #30180f; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .detail { fill: none; stroke: #30180f; stroke-width: 6.5; stroke-linecap: round; stroke-linejoin: round; }
    .skin { fill: #fee8d2; }
    .hair { fill: #fdfbf8; }
    .cloth { fill: #302728; }
    .eye-color { fill: #503024; }
    .pivot { transform-box: view-box; }
  </style>
