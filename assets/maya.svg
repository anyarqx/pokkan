    <!-- 03 | Independent hands, extending under their sleeves. -->
    <!-- 04 | Sleeves are full separate pieces: animate around each shoulder. -->
    <!-- 05 | Complete tunic behind the collar, arms and face. -->
    <!-- 06 | Collar is separate and complete behind the chin. -->
    <!-- 07 | Full head oval exists under the bangs; mouth/eyes stay nested on the head. -->
    <!-- 08 | The fringe is a closed standalone piece, with a separately authored ink edge.
         Top closure lives within the solid rear hairstyle and stays invisible. -->
    <!-- 09 | The flower and its central disc are independently editable. -->
