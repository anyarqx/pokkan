about:
  title: Edite a própria mensagem
  previewAlt: "Editor com um anúncio de encontro de astronomia"
  text: "A Pokkan é um editor visual de mensagens do Discord. Você escreve e organiza tudo na própria mensagem, acompanhando o resultado enquanto prepara um aviso, apresenta sua comunidade ou convida as pessoas para um evento."
  direct: "Comece escrevendo o que quer contar e selecione as palavras que deseja destacar. Para acrescentar uma imagem ou um botão, use o ponto de inserção no lugar em que eles devem aparecer. Os controles acompanham a parte selecionada, então você pode ajustar uma cor, trocar um emoji e voltar ao texto sem sair da mensagem."
  context: "Para organizar as mensagens de um servidor, escolha-o no seletor do topo. Essa coleção fica disponível ao dono e a quem tem Administrador ou Gerenciar Servidor. Com a Pokkan instalada, você também pode buscar canais, cargos e emojis disponíveis para sua conta."
  editingTitle: "Da primeira frase à mensagem completa"
  editing: "Um anúncio pode ser simples, com texto e um embed para reunir os detalhes, ou ganhar uma composição com grupos, imagens e links em Components V2. Se quiser ouvir a comunidade, crie uma enquete e ajuste as opções na própria prévia. Os exemplos da Pokkan já vêm prontos para editar e ajudam a descobrir como essas partes funcionam juntas."
  kitsTitle: "Aproveite o que você já criou"
  kits: "Guarde seu aviso semanal como um Kit para reabrir e mudar a data ou o conteúdo na próxima vez, sem montar tudo de novo. Os rascunhos ficam neste navegador e, ao entrar com Discord e salvar na conta, você também pode continuar em outro dispositivo."
  outputTitle: "Leve a mensagem ao Discord"
  output: "Para publicar em um canal do Discord, escolha o Kit em Mensagens e informe a URL de webhook desse canal. O guia ao lado do campo mostra como criar o webhook, e a Pokkan indica o que precisa ser ajustado na mensagem para usar essa forma de envio."
  delivery: "Se você já tem uma mensagem em outra ferramenta, pode trazê-la pelo JSON e continuar no editor. Também é possível copiar o resultado para usar fora da Pokkan ou baixar o Kit completo para guardar uma cópia."
  examplesTitle: "Experimente com uma mensagem pronta"
