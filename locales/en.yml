about:
  title: Compose the message itself
  previewAlt: "Editor with an astronomy meetup announcement"
  text: "Pokkan is a visual Discord message editor. Write and arrange the message itself, watching it take shape as you prepare an announcement, introduce your community or invite people to an event."
  direct: "Start with what you want to say. Select words to format them, then use an insertion point where you want an image or a button to appear. Controls follow the part you select, so you can adjust a color, change an emoji and return to writing without leaving the message."
  context: "Choose your server in the topbar to keep its messages together. The collection is available to the server owner and people with Administrator or Manage Server permission. With Pokkan installed, you can also search channels, roles and emoji available to your account."
  editingTitle: "From the first sentence to a complete message"
  editing: "An announcement can stay simple, with text and an embed for the details, or use Components V2 to arrange groups, images and links. To ask your community a question, add a poll and edit its choices in the preview. Pokkan's editable examples give you a starting point and show how the pieces fit together."
  kitsTitle: "Build on the work you have already done"
  kits: "Keep a weekly announcement as a Kit so you can reopen it and update the date or details next time, without rebuilding it. Drafts stay in this browser, and signing in with Discord lets you save to your account to continue on another device."
  outputTitle: "Bring the message to Discord"
  output: "To post in a Discord channel, choose your Kit in Messages and enter that channel's webhook URL. The guide beside the field walks through creating the webhook, and Pokkan flags anything in the message that this sending method cannot handle."
  delivery: "If you already have a message in another tool, import its JSON and continue in the editor. You can also copy the result for use elsewhere or download the complete Kit to keep a backup."
  examplesTitle: "Try an editable message"
