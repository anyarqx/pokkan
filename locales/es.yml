about:
  title: Edita el propio mensaje
  previewAlt: Mensaje de bienvenida con una Section y enlaces en el editor de Pokkan
  text: "Pokkan es un editor visual de mensajes de Discord. Escribe y organiza la propia publicación mientras ves el resultado, ya sea un aviso, una presentación de tu comunidad o una invitación a un evento."
  direct: "Empieza por lo que quieres contar. Selecciona palabras para darles formato y usa un punto de inserción donde quieras añadir una imagen o un botón. Los controles acompañan a la parte seleccionada, así que puedes ajustar un color, cambiar un emoji y volver al texto sin salir del mensaje."
  context: "Para organizar los mensajes de una comunidad, elige un servidor con Pokkan instalado. Sus miembros pueden encontrar los Kits y crear otros, mientras el creador de cada Kit y los administradores pueden mantenerlo. Al escribir, busca canales y roles por nombre para incluirlos en el mensaje."
  editingTitle: "De la primera frase al mensaje completo"
  editing: "Un anuncio puede ser sencillo, con texto y un embed para reunir los detalles, o usar Components V2 para organizar grupos, imágenes y enlaces. Si quieres consultar a tu comunidad, añade una encuesta y edita las opciones en la vista previa. Los ejemplos de Pokkan están listos para editar y muestran cómo combinar estas partes."
  kitsTitle: "Aprovecha lo que ya has creado"
  kits: "Guarda tu aviso semanal como un Kit para volver a abrirlo y actualizar la fecha o los detalles la próxima vez, sin montarlo todo de nuevo. Los borradores permanecen en este navegador y, al entrar con Discord y guardar en tu cuenta, puedes continuar desde otro dispositivo."
  outputTitle: "Lleva el mensaje a Discord"
  output: "Para publicar en un canal de Discord, elige tu Kit en Mensajes e introduce la URL de webhook de ese canal. La guía junto al campo explica cómo crear el webhook, y Pokkan indica qué necesita un ajuste en el mensaje para usar esta forma de envío."
  delivery: "Si ya tienes un mensaje en otra herramienta, importa su JSON y continúa en el editor. También puedes copiar el resultado para usarlo fuera de Pokkan o descargar el Kit completo como copia de seguridad."
  examplesTitle: "Prueba con un mensaje preparado"
