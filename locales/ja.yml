about:
  title: メッセージそのものを編集
  previewAlt: Sectionとリンクを組み合わせた歓迎メッセージの編集画面
  text: "PokkanはDiscordメッセージのビジュアルエディターです。お知らせやコミュニティの紹介、イベントへの招待を、表示されるメッセージを見ながら書いて組み立てられます。"
  direct: "まずは伝えたいことを書いてみましょう。強調したい言葉を選んで書式を変え、画像やボタンを置きたい場所に追加します。選択したパーツのそばに操作ボタンが現れるので、色や絵文字を調整したあとも、そのまま文章の続きを書けます。"
  context: "コミュニティのメッセージをまとめるときは、Pokkanをインストールしたサーバーを選びます。メンバーはKitを探したり新しく作ったりでき、作成者とサーバー管理者が内容を更新できます。文章にチャンネルやロールを入れるときも、名前で検索して選べます。"
  editingTitle: "最初の一文から、伝わるメッセージへ"
  editing: "文章とembedで要点をまとめるシンプルなお知らせも、Components V2で画像やリンクをグループに分けた構成も作れます。コミュニティに意見を聞きたいときは、投票を追加してプレビューで選択肢を編集しましょう。編集可能なサンプルを開くと、パーツの組み合わせ方を試しながら覚えられます。"
  kitsTitle: "作ったメッセージを、次にも生かす"
  kits: "毎週のお知らせを毎回作り直す必要はありません。Kitとして分かりやすい名前で残しておけば、次回は開いて日付や内容を変えるところから始められます。下書きはブラウザーに残り、Discordでログインすればアカウントに保存して別の端末から続きを編集できます。"
  outputTitle: "できあがったメッセージをDiscordへ"
  output: "Discordのチャンネルに投稿するには、メッセージ画面でKitを選び、そのチャンネルのWebhook URLを入力します。入力欄のそばにあるガイドでWebhookの作成手順を確認でき、この送信方法に対応していない内容があればPokkanが修正箇所を知らせます。"
  delivery: "他のツールで作ったメッセージは、JSONを読み込んで編集を続けられます。完成したデータをコピーして別の場所で使ったり、Kit全体をダウンロードして手元に残したりすることもできます。"
  examplesTitle: "サンプルを開いて試す"
